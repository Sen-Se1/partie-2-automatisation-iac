
---
- name: Installation et déploiement des conteneurs Docker
  hosts: webserver
  become: true
  gather_facts: true

  tasks:

    # ==========================================
    # 1. INSTALLATION DE JENKINS
    # ==========================================

    - name: Installer les dépendances de Jenkins
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
          - curl
        state: present
        update_cache: true

    - name: Créer le dossier des clés APT
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger la clé officielle Jenkins
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Ajouter le dépôt Jenkins LTS
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Installer Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Démarrer et activer Jenkins
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    # ==========================================
    # 2. INSTALLATION DE DOCKER
    # ==========================================

    - name: Installer Docker et Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Démarrer et activer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ==========================================
    # 3. INSTALLATION DE PORTAINER
    # ==========================================

    - name: Créer le volume Portainer
      ansible.builtin.command:
        cmd: docker volume create portainer_data
      register: portainer_volume
      changed_when: "'portainer_data' in portainer_volume.stdout"

    - name: Vérifier si Portainer existe déjà
      ansible.builtin.command:
        cmd: docker container inspect portainer
      register: portainer_check
      failed_when: false
      changed_when: false

    - name: Déployer Portainer
      ansible.builtin.command:
        cmd: >
          docker run -d
          -p 8000:8000
          -p 9443:9443
          --name portainer
          --restart=always
          -v /var/run/docker.sock:/var/run/docker.sock
          -v portainer_data:/data
          portainer/portainer-ce:lts
      when: portainer_check.rc != 0

    # ==========================================
    # 4. DEPLOIEMENT DU CONTENEUR WEB
    # ==========================================

    - name: Créer le dossier de déploiement Web
      ansible.builtin.file:
        path: /opt/webapp
        state: directory
        mode: '0755'

    - name: Copier docker-compose.yml sur Webserver
      ansible.builtin.copy:
        src: files/docker-compose.yml
        dest: /opt/webapp/docker-compose.yml
        mode: '0644'

    - name: Télécharger l'image Docker Hub
      ansible.builtin.command:
        cmd: docker pull sen5e1/webserver:1.0

    - name: Déployer le conteneur Web avec Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/webapp
